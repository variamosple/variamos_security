name: Publish the Python package

# Publishes python/ to PyPI (variamos-security) with trusted publishing: PyPI
# trusts this workflow of this repository in the "pypi" environment, so no
# token is stored. A release starts with the tag python-vX.Y.Z, pushed on a
# commit of main whose setup.py has version X.Y.Z; the upload then waits for
# an approval in the "pypi" environment.
#
# Settings on PyPI (project variamos-security, Publishing): owner variamosple,
# repository variamos_security, workflow publish-python.yml, environment pypi.

on:
  push:
    tags: ['python-v*']

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v7
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Check that the tagged commit is on main
        run: git merge-base --is-ancestor "$GITHUB_SHA" origin/main

      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: '3.9'

      - name: Check that the tag matches the version of setup.py
        working-directory: python
        env:
          TAG: ${{ github.ref_name }}
        run: |
          version=$(python -c "import re, pathlib; print(re.search(r\"version='([^']+)'\", pathlib.Path('setup.py').read_text()).group(1))")
          echo "Tag $TAG, version $version"
          test "$TAG" = "python-v$version"

      # The tests verify a token signed by the built Node library
      - name: Set up Node.js
        uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
          cache: npm
          cache-dependency-path: package-lock.json

      - name: Build the Node library
        run: npm ci --ignore-scripts && npm run build

      - name: Run the tests
        working-directory: python
        env:
          VARIAMOS_REQUIRE_NODE_TOKEN: '1'
        run: |
          python -m pip install -r requirements-test.txt
          python -m pytest

      - name: Build the package
        working-directory: python
        run: |
          python -m pip install build
          python -m build --outdir ../python-dist

      - name: Keep the package for the upload
        uses: actions/upload-artifact@v7
        with:
          name: python-dist
          path: python-dist/
          if-no-files-found: error

  publish:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: pypi
      url: https://pypi.org/project/variamos-security/
    permissions:
      # The OpenID Connect token that PyPI trusts
      id-token: write

    steps:
      - name: Fetch the package
        uses: actions/download-artifact@v8
        with:
          name: python-dist
          path: python-dist/

      # Also publishes the attestations of the package
      - name: Publish to PyPI
        uses: pypa/gh-action-pypi-publish@7245906fb61fa33a13554f9d5fb856fe61758086 # v1.14.3
        with:
          packages-dir: python-dist/
